<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KTEC — ระบบอัปเดตและจัดการเกจ</title>
<meta name="description" content="ดาวน์โหลดเฟิร์มแวร์เกจ KTEC ล่าสุด ค้นรหัส DTC และแจ้งปัญหา">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050a14;--bg2:#08111f;--panel:#0b1a2e;--panel2:#0d2238;--line:#173252;
  --cyan:#00e5ff;--blue:#2a7fff;--text:#e8f1ff;--muted:#8aa0c2;
  --ok:#28ff8c;--warn:#ffd21e;--bad:#ff5c6c;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;color:var(--text);min-height:100vh;
  font:16px/1.65 "Kanit","Sarabun","Noto Sans Thai",Tahoma,sans-serif;
  background:
    radial-gradient(900px 420px at 80% -10%,rgba(0,229,255,.10),transparent 60%),
    radial-gradient(700px 380px at 0% 0%,rgba(42,127,255,.12),transparent 60%),
    var(--bg);
}
a{color:var(--cyan)}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(5,10,20,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;min-height:64px}
.logo{display:block;text-decoration:none;color:var(--cyan);line-height:1.1}
.logo b{font:800 26px "Orbitron",sans-serif;letter-spacing:2px}
.logo small{display:block;font-size:11px;color:var(--muted);letter-spacing:.3px;margin-top:2px}
nav{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{white-space:nowrap;padding:7px 14px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:400;border:1px solid transparent}
nav a:hover{color:var(--text)}
nav a.on{color:var(--cyan);background:rgba(0,229,255,.08);border-color:rgba(0,229,255,.35)}
.lang{font:500 13px "Kanit",sans-serif;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.lang:hover{border-color:var(--cyan)}

/* ---------- layout ---------- */
main{padding:28px 0 56px}
.view{display:none}
.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h1,h2,h3{margin:0;font-weight:600}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:26px}
.hero{padding:34px 30px;background:
  radial-gradient(520px 240px at 100% 0%,rgba(0,229,255,.10),transparent 70%),
  linear-gradient(180deg,var(--panel2),var(--bg2))}
.hero h1{font-size:30px}
.hero p{color:var(--muted);margin:8px 0 0}
.lbl{color:var(--muted);font-size:14px;margin-top:22px}
.ver{font:800 46px/1.1 "Orbitron",sans-serif;color:var(--cyan);margin:4px 0 6px;text-shadow:0 0 24px rgba(0,229,255,.35)}
.notes{font-size:13.5px;color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.tile{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;transition:.15s}
.tile:hover{border-color:var(--cyan);transform:translateY(-2px)}
.tile h3{font-size:18px}
.tile p{margin:0;color:var(--muted);font-size:14.5px;flex:1}
.arrow{align-self:flex-start;margin-top:10px;width:36px;height:32px;display:grid;place-items:center;border:1px solid rgba(0,229,255,.45);border-radius:9px;color:var(--cyan);background:rgba(0,229,255,.06)}

.btn{display:inline-block;margin:14px 10px 0 0;padding:10px 20px;font:500 15px "Kanit",sans-serif;color:var(--cyan);background:rgba(0,229,255,.07);border:1px solid rgba(0,229,255,.5);border-radius:10px;text-decoration:none;cursor:pointer;box-shadow:0 0 18px rgba(0,229,255,.12)}
.btn:hover{background:rgba(0,229,255,.18)}
.btn.solid{background:var(--cyan);color:#021018;border-color:var(--cyan)}
.btn[hidden]{display:none}
.title{font-size:24px;margin-bottom:4px}
.sub{color:var(--muted);margin:0 0 18px}

dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 22px;margin:0 0 6px}
dt{color:var(--muted)}dd{margin:0;font-weight:500;word-break:break-all}
.status{margin:14px 0 0;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);font-weight:500}
.status.ok{color:var(--ok);border-color:rgba(40,255,140,.4)}
.status.warn{color:var(--warn);border-color:rgba(255,210,30,.45)}
.status.info{color:var(--muted)}
ol.steps{margin:18px 0 0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:10px 0 10px 46px;border-top:1px solid var(--line)}
ol.steps li:first-child{border-top:0}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 14px "Orbitron",sans-serif;color:var(--cyan);border:1px solid rgba(0,229,255,.5);background:rgba(0,229,255,.07)}
.tip{margin-top:16px;padding:12px 14px;border-left:3px solid var(--warn);background:rgba(255,210,30,.06);border-radius:0 10px 10px 0;color:#f3e7b3;font-size:14.5px}
code,.mono{font-family:ui-monospace,Consolas,monospace;color:var(--cyan)}

textarea,input[type=search]{width:100%;margin-top:6px;padding:12px 14px;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px}
textarea{min-height:130px;resize:vertical}
textarea:focus,input:focus,.btn:focus-visible,a:focus-visible,.lang:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
small.hint{display:block;margin-top:12px;color:var(--muted)}

.dtc{margin-top:14px;display:grid;gap:10px}
.code{display:grid;grid-template-columns:90px 1fr;gap:14px;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.code b{font:600 18px "Orbitron",sans-serif;color:var(--cyan)}
.code span{color:var(--text)}
.empty{color:var(--muted);padding:14px 4px}

footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px;padding:22px 0 30px;text-align:center}

@media(max-width:760px){
  .grid3{grid-template-columns:1fr}
  .bar{flex-wrap:wrap;padding:10px 0;gap:10px}
  nav{order:3;flex-basis:100%}
  .hero h1{font-size:25px}.ver{font-size:38px}
  .code{grid-template-columns:1fr;gap:2px}
}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="logo" href="#home" aria-label="KTEC"><b>KTEC</b><small data-t="tagline"></small></a>

      <a href="#report" data-v="report" data-t="nav_report"></a>
      <a href="#dtc" data-v="dtc" data-t="nav_dtc"></a>
      <a href="#howto" data-v="howto" data-t="nav_how"></a>
    </nav>
    <button class="lang" id="lang" type="button" aria-label="Language">EN</button>
  </div>
</header>

<main class="wrap">

  <!-- ===== หน้าแรก ===== -->
  <section class="view" id="v-home">
    <div class="card hero">
      <h1 data-t="hero_title"></h1>
      <p data-t="hero_sub"></p>
      <div class="lbl" data-t="latest"></div>
      <div class="ver" id="heroVer">-</div>
      <div class="notes" id="heroNotes"></div>
      <a class="btn solid" href="#firmware" data-t="nav_fw"></a>
    </div>
    <div class="grid3">
      <a class="tile" href="#firmware"><h3 data-t="nav_fw"></h3><p data-t="tile_fw"></p><span class="arrow">→</span></a>
      <a class="tile" href="#report"><h3 data-t="nav_report"></h3><p data-t="tile_report"></p><span class="arrow">→</span></a>
      <a class="tile" href="#dtc"><h3 data-t="nav_dtc"></h3><p data-t="tile_dtc"></p><span class="arrow">→</span></a>
    </div>
  </section>

  <!-- ===== เฟิร์มแวร์ ===== -->
  <section class="view" id="v-firmware">
    <div class="card">
      <h2 class="title" data-t="nav_fw"></h2>
      <p class="sub" data-t="fw_sub"></p>
      <dl>
        <dt data-t="dev_id"></dt><dd id="devId">-</dd>
        <dt data-t="cur_ver"></dt><dd id="curVer">-</dd>
        <dt data-t="new_ver"></dt><dd id="newVer">-</dd>
      </dl>
      <p class="status info" id="status"></p>
      <a class="btn solid" id="dl" href="#" download data-t="dl_bin"></a>
      <ol class="steps" id="fwSteps"></ol>
      <div class="tip" data-t="wifi_tip"></div>
    </div>
  </section>

  <!-- ===== แจ้งปัญหา ===== -->
  <section class="view" id="v-report">
    <div class="card">
      <h2 class="title" data-t="nav_report"></h2>
      <p class="sub" data-t="rep_sub"></p>
      <label for="msg" data-t="rep_label"></label>
      <textarea id="msg" data-ph="rep_ph"></textarea>
      <a class="btn solid" id="mail" href="#" data-t="send_mail"></a>
      <a class="btn" id="gh" href="#" data-t="send_gh"></a>
      <small class="hint" data-t="rep_hint"></small>
    </div>
  </section>

  <!-- ===== ค้นรหัส DTC ===== -->
  <section class="view" id="v-dtc">
    <div class="card">
      <h2 class="title" data-t="nav_dtc"></h2>
      <p class="sub" data-t="dtc_sub"></p>
      <label for="q" data-t="dtc_label"></label>
      <input id="q" type="search" autocomplete="off" data-ph="dtc_ph">
      <div class="dtc" id="dtcList" aria-live="polite"></div>
      <small class="hint" data-t="dtc_note"></small>
    </div>
  </section>

  <!-- ===== วิธีใช้ ===== -->
  <section class="view" id="v-howto">
    <div class="card">
      <h2 class="title" data-t="nav_how"></h2>
      <p class="sub" data-t="how_sub"></p>
      <ol class="steps" id="howSteps"></ol>
      <div class="tip" data-t="how_tip"></div>
    </div>
  </section>

</main>

<footer>
  <div class="wrap">© 2026 KTEC · <span data-t="foot"></span><span id="footMail"></span></div>
</footer>

/* ================= โค้ดหน้าเว็บ ================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const qs = new URLSearchParams(location.search);
const devId = qs.get("id") || "-";
const curFw = qs.get("fw") || "-";

let lang = "th";
try { lang = localStorage.getItem("ktec_lang") || ((navigator.language || "").startsWith("th") ? "th" : "en"); } catch (e) {}
if (!T[lang]) lang = "th";

const t = k => (T[lang][k] || "").replace("{ssid}", CONFIG.ssid).replace("{ota}", CONFIG.ota);

/* เทียบเวอร์ชัน 1.2.3 → -1 / 0 / 1 */
function cmp(a, b) {
  const x = String(a).split(".").map(n => parseInt(n, 10) || 0);
  const y = String(b).split(".").map(n => parseInt(n, 10) || 0);
  for (let i = 0; i < Math.max(x.length, y.length); i++) {
    const d = (x[i] || 0) - (y[i] || 0);
    if (d) return d < 0 ? -1 : 1;
  }
  return 0;
}

function fillList(id, keys) {
  const ol = $(id); ol.textContent = "";
  keys.forEach(k => { const li = document.createElement("li"); li.textContent = t(k); ol.appendChild(li); });
}

function renderStatus() {
  const el = $("#status");
  let key = "st_none", cls = "status info";
  if (curFw !== "-") {
    const c = cmp(curFw, CONFIG.latest);
    if (c === 0) { key = "st_ok"; cls = "status ok"; }
    else if (c < 0) { key = "st_old"; cls = "status warn"; }
    else { key = "st_new"; cls = "status info"; }
  }
  el.textContent = t(key); el.className = cls;
}

function renderDtc() {
  const box = $("#dtcList"), q = $("#q").value.trim().toLowerCase();
  const i = lang === "th" ? 1 : 2;
  const hit = DTC.filter(r => !q || r[0].toLowerCase().includes(q) || r[1].toLowerCase().includes(q) || r[2].toLowerCase().includes(q));
  box.textContent = "";
  if (!hit.length) { const d = document.createElement("div"); d.className = "empty"; d.textContent = t("dtc_none"); box.appendChild(d); return; }
  hit.slice(0, 60).forEach(r => {
    const row = document.createElement("div"); row.className = "code";
    const b = document.createElement("b"); b.textContent = r[0];
    const s = document.createElement("span"); s.textContent = r[i];
    row.append(b, s); box.appendChild(row);
  });
}

function applyLang() {
  document.documentElement.lang = lang;
  $$("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  $$("[data-ph]").forEach(el => { el.placeholder = t(el.dataset.ph); });
  $("#lang").textContent = lang === "th" ? "EN" : "TH";
  $("#heroNotes").textContent = CONFIG.notes[lang] || "";
  fillList("#fwSteps", ["s1", "s2", "s3", "s4"]);
  fillList("#howSteps", ["h1", "h2", "h3", "h4", "h5"]);
  renderStatus(); renderDtc();
}

$("#lang").onclick = () => {
  lang = lang === "th" ? "en" : "th";
  try { localStorage.setItem("ktec_lang", lang); } catch (e) {}
  applyLang();
};

/* ---- ค่าคงที่ในหน้า ---- */
function showLatest() {
  $("#heroVer").textContent = "v" + CONFIG.latest;
  $("#newVer").textContent = CONFIG.latest;
  renderStatus();
}
$("#devId").textContent = devId;
$("#curVer").textContent = curFw;
showLatest();
/* อ่านเวอร์ชันล่าสุดจาก firmware/version.json  แก้เลขที่ไฟล์นั้นที่เดียวพอ (ถ้าโหลดไม่ได้ใช้ค่า CONFIG.latest) */
fetch("firmware/version.json?t=" + Date.now(), { cache: "no-store" })
  .then(r => r.ok ? r.json() : null)
  .then(j => { if (j && j.latest) { CONFIG.latest = String(j.latest); showLatest(); } })
  .catch(() => {});
$("#dl").href = CONFIG.file;
$("#q").addEventListener("input", renderDtc);

/* ---- แจ้งปัญหา ---- */
const info = () => "\n\n" + t("mail_info_id") + ": " + devId + "\n" + t("mail_info_fw") + ": " + curFw;
if (CONFIG.email) {
  $("#footMail").textContent = " · " + CONFIG.email;
  $("#mail").onclick = e => {
    e.preventDefault();
    location.href = "mailto:" + CONFIG.email + "?subject=" + encodeURIComponent(t("mail_subject") + " " + devId) + "&body=" + encodeURIComponent($("#msg").value + info());
  };
} else { $("#mail").hidden = true; }

const ghUser = location.hostname.endsWith(".github.io") ? location.hostname.split(".")[0] : "";
const ghRepo = location.pathname.split("/")[1] || "";
if (ghUser && ghRepo) {
  $("#gh").onclick = e => {
    e.preventDefault();
    window.open("https://github.com/" + ghUser + "/" + ghRepo + "/issues/new?title=" + encodeURIComponent(t("gh_title") + " " + devId) + "&body=" + encodeURIComponent($("#msg").value + info()), "_blank", "noopener");
  };
} else { $("#gh").hidden = true; }

/* ---- สลับหน้าด้วย #hash ---- */
const VIEWS = ["home", "firmware", "report", "dtc", "howto"];
function route() {
  let v = location.hash.replace("#", "");
  if (!VIEWS.includes(v)) {
    if (qs.get("page") === "report") v = "report";
    else if (qs.get("id") || qs.get("fw")) v = "firmware";
    else v = "home";
  }
  $$(".view").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
  $$("#nav a").forEach(a => a.classList.toggle("on", a.dataset.v === v));
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

applyLang();
route();
</script>
</body>
</html>
